services:
  storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppe-storage
    network_mode: host
    environment:
      STORAGE_DB: /data/storage.db
      STORAGE_PKI_DIR: /data/pki
      STORAGE_SERVICE_ID: ${STORAGE_SERVICE_ID:-storage-01}
      STORAGE_LOCAL_URL: ${STORAGE_LOCAL_URL:-}
    volumes:
      - storage-data:/data
    restart: unless-stopped

volumes:
  storage-data:
