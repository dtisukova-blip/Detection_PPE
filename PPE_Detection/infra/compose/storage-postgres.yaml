services:
  postgres-storage:
    image: postgres:16
    container_name: ppe-postgres-storage
    network_mode: host
    command:
      - -p
      - "${POSTGRES_PORT:-55432}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppe_storage}
      POSTGRES_USER: ${POSTGRES_USER:-ppe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppe_change_me}
    volumes:
      - postgres-storage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${POSTGRES_PORT:-55432} -U ${POSTGRES_USER:-ppe} -d ${POSTGRES_DB:-ppe_storage}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-storage-data:
